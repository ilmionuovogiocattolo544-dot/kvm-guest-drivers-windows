name: Build viogpu

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Remove InfVerif elements from project files
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                Write-Host "Cleaning InfVerif from $($_.Name)"
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }
        Get-ChildItem -Recurse -Filter "*.props" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                Write-Host "Cleaning InfVerif from $($_.Name)"
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build all viogpu components
      shell: cmd
      run: |
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpu\viogpu.vcxproj
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpures\viogpures.vcxproj
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpusc\viogpusc.vcxproj
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpuap\viogpuap.vcxproj

    - name: Collect build outputs recursively
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path .\final-output
        Get-ChildItem -Path . -Recurse -Include "*.sys","*.inf","*.cat" | Where-Object { $_.FullName -notlike "*\.git\*" } | ForEach-Object {
            Write-Host "Copying: $($_.FullName)"
            Copy-Item $_.FullName -Destination .\final-output -Force
        }
        Get-ChildItem .\final-output

    - name: Upload clean viogpu artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viogpu-clean-package
        path: final-output/
