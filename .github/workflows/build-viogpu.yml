name: Build viogpu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        uses: frabert/Windows-Driver-Toolkit@main

      - name: Build viogpu
        shell: cmd
        run: |
          call build\SetVsEnv.bat
          call viogpu\build_AllNoSdv.bat

      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver
          path: |
            **/viogpu.inf
            **/viogpu.sys
            **/viogpu.cat
