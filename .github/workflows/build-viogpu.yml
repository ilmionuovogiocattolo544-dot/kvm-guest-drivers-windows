name: Build viogpu

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Remove InfVerif elements from project files
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                Write-Host "Cleaning InfVerif from $($_.Name)"
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }
        Get-ChildItem -Recurse -Filter "*.props" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                Write-Host "Cleaning InfVerif from $($_.Name)"
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build viogpu only
      shell: cmd
      run: |
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpu.sln

    - name: Search all generated files
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.inf" | Select-Object FullName
        Get-ChildItem -Recurse -Filter "*.sys" | Select-Object FullName
        Get-ChildItem -Recurse -Filter "*.cat" | Select-Object FullName

    - name: Upload drivers
      uses: actions/upload-artifact@v4
      with:
        name: viogpu-driver
        path: |
          **/*.inf
          **/*.sys
          **/*.cat
