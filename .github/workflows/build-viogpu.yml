name: Build viogpu
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Check installed WDK versions
        shell: powershell
        run: |
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\build" -Directory |
            Select-Object -ExpandProperty Name

      - name: Build viogpu
        shell: cmd
        run: |
          msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu/viogpu.sln /p:SkipPackageVerification=true /p:ApiValidator_Enable=false
          if errorlevel 1 exit /b 1
          msbuild /m /p:Configuration="Win10 Release" /p:Platform=ARM64 viogpu/viogpu.sln /p:SkipPackageVerification=true /p:ApiValidator_Enable=false
          if errorlevel 1 exit /b 1
          msbuild /m /p:Configuration="Win11 Release" /p:Platform=x64 viogpu/viogpu.sln /p:SkipPackageVerification=true /p:ApiValidator_Enable=false
          if errorlevel 1 exit /b 1
          msbuild /m /p:Configuration="Win11 Release" /p:Platform=ARM64 viogpu/viogpu.sln /p:SkipPackageVerification=true /p:ApiValidator_Enable=false
          if errorlevel 1 exit /b 1

      - name: Upload Win10 x64 package
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-win10-amd64
          path: viogpu/Install/Win10/amd64/*
          if-no-files-found: error

      - name: Upload Win11 x64 package
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-win11-amd64
          path: viogpu/Install/Win11/amd64/*
          if-no-files-found: error

      - name: Upload Win11 ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-win11-arm64
          path: viogpu/Install/Win11/ARM64/*
          if-no-files-found: error

      - name: Upload Win10 ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver-win10-arm64
          path: viogpu/Install/Win10/ARM64/*
          if-no-files-found: error
