name: Build viogpu

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Remove InfVerif elements from project files
      shell: powershell
      run: |
        Get-ChildItem -Recurse -Filter "*.vcxproj" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }
        Get-ChildItem -Recurse -Filter "*.props" | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            if ($content -match '<RunInfVerif>') {
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($content, '<RunInfVerif>.*?</RunInfVerif>', '', 'Singleline')
                $cleaned = [System.Text.RegularExpressions.Regex]::Replace($cleaned, '<RunInfVerif\s*/>', '')
                Set-Content -Path $_.FullName -Value $cleaned -NoNewline
            }
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build viogpu solution/projects
      shell: cmd
      run: |
        msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpu.sln

    - name: Collect all compiled binaries and infs
      shell: powershell
      run: |
        New-Item -ItemType Directory -Force -Path .\final-output
        # Copiamo tutto ciò che riguarda viogpu (sys, inf, cat, dll, etc.) ricorsivamente
        Get-ChildItem -Path "." -Recurse -Filter "*viogpu*" | Where-Object { $_.FullName -notlike "*\.git\*" -and $_.PSIsContainer -eq $false } | ForEach-Object {
            Write-Host "Copying: $($_.FullName)"
            Copy-Item $_.FullName -Destination .\final-output -Force
        }
        Get-ChildItem .\final-output

    - name: Upload clean viogpu artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viogpu-clean-package
        path: final-output/
