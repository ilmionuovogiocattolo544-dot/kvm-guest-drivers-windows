name: build-viogpu
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install WDK
        shell: pwsh
        run: winget install --id Microsoft.WindowsWDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements
      - name: Build viogpu
        shell: cmd
        run: |
          cd build
          build.bat ..\viogpu\viogpu.sln "Win10 Release" x64
      - uses: actions/upload-artifact@v4
        with:
          name: viogpu
          path: viogpu/**/*.sys
