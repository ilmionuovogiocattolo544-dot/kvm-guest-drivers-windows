name: Build viogpu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build viogpu
        shell: cmd
        run: |
          set BUILD_ARCH=amd64
          msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 viogpu\viogpu.sln || msbuild /m /p:Configuration="Win10 Release" /p:Platform=x64 virtio-win.sln

      - name: Search drivers
        shell: powershell
        run: |
          Get-ChildItem -Recurse -Include viogpu.inf,viogpu.sys,viogpu.cat

      - name: Upload drivers
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-driver
          path: |
            **/viogpu.inf
            **/viogpu.sys
            **/viogpu.cat
