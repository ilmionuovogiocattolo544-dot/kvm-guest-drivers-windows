name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Parse Solution Configurations
      shell: powershell
      run: |
        $content = Get-Content .\viogpu\viogpu.sln
        $inGlobalSection = $false
        foreach ($line in $content) {
            if ($line -match "GlobalSection\(SolutionConfigurationPlatforms\)preSolution") {
                $inGlobalSection = $true
                continue
            }
            if ($inGlobalSection -and $line -match "EndGlobalSection") {
                $inGlobalSection = $false
                break
            }
            if ($inGlobalSection) {
                Write-Host "CONFIG FOUND: $($line.Trim())"
            }
        }
