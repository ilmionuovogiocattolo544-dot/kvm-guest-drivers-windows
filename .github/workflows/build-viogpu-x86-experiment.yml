name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Windows SDK 22621 via Chocolatey
      shell: powershell
      run: |
        choco install windows-sdk-10.1 -y --version=10.0.22621.0
