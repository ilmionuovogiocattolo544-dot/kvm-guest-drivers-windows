name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Windows SDK 22621
      shell: powershell
      run: |
        $url = "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe"
        Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winsdksetup.exe"
        $p = Start-Process "$env:TEMP\winsdksetup.exe" -ArgumentList "/quiet", "/norestart", "/features", "OptionId.WindowsDesktopSoftwareDevelopmentKit" -Wait -PassThru
        if ($p.ExitCode -notin @(0, 3010)) {
          throw "Installazione SDK fallita: $($p.ExitCode)"
        }
