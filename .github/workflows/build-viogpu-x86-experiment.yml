name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Inspect Solution Configurations
      shell: powershell
      run: |
        # Mostra i progetti e le configurazioni disponibili nella solution
        msbuild .\viogpu\viogpu.sln /pp:edump.xml
        Select-String -Path edump.xml -Pattern "SolutionConfiguration" -Context 2,2
