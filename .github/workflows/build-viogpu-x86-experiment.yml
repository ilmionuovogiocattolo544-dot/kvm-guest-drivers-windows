name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build Viogpu x86
      shell: powershell
      run: |
        # Compila la solution usando la configurazione corretta (es. Win10 Release / x86 o quella identificata)
        # Se nel passaggio precedente hai visto la configurazione esatta, la inseriamo qui sotto:
        msbuild .\viogpu\viogpu.sln /p:Configuration="Win10 Release" /p:Platform="x86"

    - name: Upload Driver Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: viogpu-win10-x86
        path: |
          **/*.sys
          **/*.inf
          **/*.cat
