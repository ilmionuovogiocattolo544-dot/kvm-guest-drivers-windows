name: Experimental viogpu Win10 x86

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Install Windows SDK 22621
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/cb9de490-6e67-4ac6-8c2c-6dfabb824e8a/windowssdk/winsdksetup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\winsdksetup.exe"
          $p = Start-Process "$env:TEMP\winsdksetup.exe" -ArgumentList "/q" -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) {
            throw "Installazione SDK fallita: $($p.ExitCode)"
          }

      - name: Install legacy WDK 22621
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.microsoft.com/download/03f059f8-d6a3-4b9c-b85b-95cc401be222/wdk/wdksetup.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\wdksetup.exe"
          $p = Start-Process "$env:TEMP\wdksetup.exe" -ArgumentList "/q" -Wait -PassThru
          if ($p.ExitCode -notin @(0, 3010)) {
            throw "Installazione WDK fallita: $($p.ExitCode)"
          }

      - name: Verify legacy kit
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\Program Files (x86)\Windows Kits\10"
          foreach ($path in @(
            "$root\Include\10.0.22621.0",
            "$root\build\10.0.22621.0"
          )) {
            if (-not (Test-Path $path)) {
              throw "Kit non trovato: $path"
            }
            Write-Host "Verificato: $path"
          }

      - name: Diagnose WDK architecture validation
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $f = "C:\Program Files (x86)\Windows Kits\10\build\10.0.22621.0\WindowsDriver.common.targets"
          $lines = Get-Content $f
          for ($i = 210; $i -lt [Math]::Min(255, $lines.Length); $i++) {
            "{0}: {1}" -f ($i + 1), $lines[$i]
          }
          Select-String -Path $f -Pattern "Win32|valid architecture|TargetArch|Platform" |
            Select-Object -First 30

      - name: Build Win10 x86
        shell: cmd
        run: |
          msbuild /m /p:Configuration="Win10 Release" /p:Platform=x86 /p:WindowsTargetPlatformVersion=10.0.22621.0 /p:SkipPackageVerification=true /p:ApiValidator_Enable=false viogpu/viogpu.sln
          if errorlevel 1 exit /b 1

      - name: Verify x86 package
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dir = "viogpu/Install/Win10/x86"
          foreach ($file in @("viogpu.inf", "viogpu.sys", "viogpu.cat")) {
            $path = Join-Path $dir $file
            if (-not (Test-Path $path)) {
              throw "File mancante: $path"
            }
            Write-Host "Creato: $path"
          }

      - name: Upload Win10 x86 driver
        uses: actions/upload-artifact@v4
        with:
          name: viogpu-win10-x86
          path: viogpu/Install/Win10/x86/
          if-no-files-found: error
