name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Verify Environment and MSBuild
      shell: powershell
      run: |
        Write-Host "SDK e Visual Studio sono già preinstallati sul runner."
        msbuild /version
