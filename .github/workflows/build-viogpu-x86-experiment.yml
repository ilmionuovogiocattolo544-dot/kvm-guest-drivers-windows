name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install Windows SDK and WDK
      shell: powershell
      run: |
        winget install --id Microsoft.WindowsSDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements
        winget install --id Microsoft.WindowsWDK.10.0.26100 --silent --accept-source-agreements --accept-package-agreements

    - name: Build Viogpu x86
      shell: powershell
      run: |
        # Disabilita temporaneamente il controllo rigido della versione WDK se fallisce il caricamento della DLL dei task
        msbuild .\viogpu\viogpu.sln /p:Configuration="Win10 Release" /p:Platform="x86" /p:RunCodeAnalysis=false /p:AutoselectWDK=true
