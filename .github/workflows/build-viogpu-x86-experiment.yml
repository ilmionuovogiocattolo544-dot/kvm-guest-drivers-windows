name: Build Viogpu x86 Experiment

on:
  workflow_dispatch:

jobs:
  build-x86:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Compile Viogpu x86
      shell: powershell
      run: |
        msbuild .\viogpu\viogpu.sln /p:Configuration="Release" /p:Platform="x86"
